<!DOCTYPE HTML>
<html lang="en">

<head>
    <title>DOM Manipulation</title>

    <style>

        /* Background */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #f093fb
            );

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Main Box */
        .box {
            background-color: white;
            width: 500px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            transition: 0.3s;
        }

        /* Heading */
        #title {
            color: #333;
            font-size: 30px;
            margin-bottom: 10px;
        }

        /* Message */
        #message {
            color: #555;
            font-size: 17px;
            min-height: 25px;
        }

        /* Image */
        #myImage {
            width: 300px;
            height: 200px;
            object-fit: cover;

            border-radius: 12px;
            border: 3px solid #ddd;

            transition: 0.3s;
        }

        #myImage:hover {
            transform: scale(1.05);
        }

        /* Link */
        a {
            color: #007bff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        /* Buttons */
        button {
            width: 220px;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: #007bff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        /* New Class */
        .newbox {
            background-color: orange;
            border: 5px solid green;
            padding: 20px;
            width: 500px;
        }

    </style>
</head>

<body>

    <div class="box" id="box">

        <h2 id="title">Welcome Students</h2>

        <p id="message"></p>

        <img id="myImage"
             src="https://picsum.photos/600/400?random=10">

        <br><br>

        <a href="https://www.google.com">
            Google
        </a> <br><br>

        <button onclick="changecontent()" >Change Content </button><br><br>

        <button onclick="changestyle()"> Change Style </button>

        <button onclick="changeimage()"> Change Image </button><br><br>

        <button onclick="changelink()"> Change Link </button>

        <button onclick="changeclass()"> Change Class </button>

    </div>


    <script>

        // Change Content
        function changecontent() {

            document.getElementById("title").innerHTML =
                "Hello Students!";

            document.getElementById("message").innerHTML =
                "The content has been changed using JavaScript.";
        }


        // Change Style
        function changestyle() {

            document.getElementById("box").style.backgroundColor =
                "lightpink";

            document.getElementById("box").style.padding =
                "20px";

            document.getElementById("title").style.color =
                "red";

            document.getElementById("title").style.fontSize =
                "35px";
        }


        // Change Image
        function changeimage() {

            document.getElementById("myImage").src =
                "https://picsum.photos/600/400?random=20";
        }


        // Change Link
        function changelink() {

            let link = document.querySelector("a");

            link.href =
                "https://www.wikipedia.org";

            link.innerHTML =
                "Visit Wikipedia";
        }


        // Change Class
        function changeclass() {

            document.getElementById("box")
                .classList.toggle("newbox");
        }

    </script>

</body>

</html>
