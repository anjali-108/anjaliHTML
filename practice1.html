<!DOCTYPE html>
<html lang="en">

<head>
    <title>🚀 Fun DOM Manipulation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                120deg,
                #ff6b6b,
                #6c5ce7,
                #00cec9,
                #fdcb6e
            );

            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Main Card */
        .box {
            width: 520px;
            padding: 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            transition: 0.5s;
        }

        .box:hover {
            transform: translateY(-8px);
        }

        /* Heading */
        #title {
            font-size: 32px;
            color: #6c5ce7;

            text-shadow:
                2px 2px 5px rgba(0, 0, 0, 0.15);
        }

        /* Message */
        #message {
            color: #555;
            font-size: 17px;
            font-weight: bold;

            min-height: 30px;
        }

        /* Image */
        #myImage {
            width: 320px;
            height: 210px;

            object-fit: cover;

            border-radius: 20px;
            border: 5px solid white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            transition: 0.5s;
        }

        #myImage:hover {
            transform: rotate(2deg) scale(1.08);
        }

        /* Link */
        a {
            display: inline-block;

            padding: 10px 20px;

            border-radius: 20px;

            background: #e3f2fd;

            color: #1976d2;

            font-size: 18px;
            font-weight: bold;

            text-decoration: none;

            transition: 0.3s;
        }

        a:hover {
            background: #1976d2;
            color: white;

            transform: scale(1.1);
        }

        /* Buttons */
        button {
            width: 280px;
            padding: 13px;

            border: none;
            border-radius: 30px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(
                45deg,
                #6c5ce7,
                #00cec9
            );

            box-shadow:
                0 5px 15px rgba(108, 92, 231, 0.4);

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);

            box-shadow:
                0 8px 25px rgba(108, 92, 231, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Special Class */
        .newbox {
            background: linear-gradient(
                135deg,
                #ffeaa7,
                #fab1a0
            );

            border: 5px solid #e17055;

            transform: rotate(1deg);
        }

        /* Counter */
        #counter {
            font-size: 18px;
            color: #6c5ce7;
            font-weight: bold;
        }

    </style>
</head>


<body>

    <div class="box" id="box">

        <h2 id="title">
            👋 Welcome Students! 🎓
        </h2>

        <p id="message">
            🚀 Let's have some fun with JavaScript!
        </p>

        <p id="counter">
            🔢 Clicks: 0
        </p>

        <img
            id="myImage"
            src="https://picsum.photos/600/400?random=10"
            alt="Random Image"
        >

        <br><br>

        <a
            id="myLink"
            href="https://www.google.com"
            target="_blank"
        >
            🔍 Google
        </a>

        <br><br>

        <button onclick="changecontent()">
            ✏️ Change Content
        </button>

        <br><br>

        <button onclick="changestyle()">
            🎨 Change Style
        </button>

        <br><br>

        <button onclick="changeimage()">
            🖼️ Change Image
        </button>

        <br><br>

        <button onclick="changelink()">
            🔗 Change Link
        </button>

        <br><br>

        <button onclick="changeclass()">
            🪄 Change Class
        </button>

        <br><br>

        <button onclick="surprise()">
            🎁 Surprise Me!
        </button>

    </div>


    <script>

        let clicks = 0;


        // Update Counter
        function updateCounter() {

            clicks++;

            document.getElementById("counter").innerHTML =
                "🔢 Clicks: " + clicks;
        }


        // Change Content
        function changecontent() {

            updateCounter();

            document.getElementById("title").innerHTML =
                "🎉 Hello Students! 🚀";

            document.getElementById("message").innerHTML =
                "✨ You just changed the content using JavaScript! 😎";
        }


        // Change Style
        function changestyle() {

            updateCounter();

            document.getElementById("box").style.background =
                "linear-gradient(135deg, #ff9a9e, #fad0c4)";

            document.getElementById("title").style.color =
                "#e84393";

            document.getElementById("title").style.fontSize =
                "38px";

            document.getElementById("message").innerHTML =
                "🎨 Wow! The style has changed! ✨";
        }


        // Change Image
        function changeimage() {

            updateCounter();

            let randomNumber =
                Math.floor(Math.random() * 100) + 1;

            document.getElementById("myImage").src =
                "https://picsum.photos/600/400?random="
                + randomNumber;

            document.getElementById("message").innerHTML =
                "🖼️ New image loaded! 🔥";
        }


        // Change Link
        function changelink() {

            updateCounter();

            let link =
                document.getElementById("myLink");

            link.href =
                "https://www.wikipedia.org";

            link.innerHTML =
                "📚 Visit Wikipedia";

            document.getElementById("message").innerHTML =
                "🔗 The link has been changed!";
        }


        // Change Class
        function changeclass() {

            updateCounter();

            document.getElementById("box")
                .classList.toggle("newbox");

            document.getElementById("message").innerHTML =
                "🪄 Class changed successfully!";
        }


        // Surprise Button
        function surprise() {

            updateCounter();

            let emojis = [
                "🎉",
                "🚀",
                "🔥",
                "😎",
                "🤩",
                "💥",
                "🌟",
                "🎊"
            ];

            let randomEmoji =
                emojis[
                    Math.floor(
                        Math.random() * emojis.length
                    )
                ];

            document.getElementById("title").innerHTML =
                randomEmoji +
                " DOM Magic! " +
                randomEmoji;

            document.getElementById("message").innerHTML =
                "🎁 Surprise! You discovered a DOM trick! " +
                randomEmoji;

            document.getElementById("box").style.transform =
                "scale(1.05) rotate(1deg)";

            setTimeout(function () {

                document.getElementById("box").style.transform =
                    "scale(1)";

            }, 500);
        }

    </script>

</body>

</html>
